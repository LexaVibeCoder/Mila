services:
  # ============================================================
  # Mila Bot — Telegram userbot
  # ============================================================

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mila-bot
    user: root
    restart: unless-stopped
    # Keep stdin open so TDLib auth prompts can be answered via
    # `docker attach mila-bot` (detach with Ctrl-P Ctrl-Q).
    stdin_open: true
    tty: true
    env_file:
      - .env
    volumes:
      - .:/app
      - mila_data:/app/data
      - mila_logs:/app/logs
      - ./models:/app/models:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    command: python main.py
    networks:
      - mila_network

  # ============================================================
  # Mila Observatory — FastAPI web panel
  # ============================================================

  observatory:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mila-observatory
    user: root
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8080:8080"
    volumes:
      - .:/app:z
      - mila_data:/app/data
      - mila_logs:/app/logs
      - ./models:/app/models:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    command: uvicorn Mila_observatory.server:app --host 0.0.0.0 --port 8080 --reload
    depends_on:
      - bot
    networks:
      - mila_network

volumes:
  mila_data:
  mila_logs:

networks:
  mila_network:
    driver: bridge