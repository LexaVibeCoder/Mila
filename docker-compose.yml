services:
  # ============================================================
  # Mila Bot — Telegram userbot
  # ============================================================

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mila-bot
    user: root
    restart: unless-stopped
    # Keep stdin open so TDLib auth prompts can be answered via
    # `docker attach mila-bot` (detach with Ctrl-P Ctrl-Q).
    stdin_open: true
    tty: true
    env_file:
      - .env
    volumes:
      - .:/app
      - mila_data:/app/data
      - mila_logs:/app/logs
      - ./models:/app/models:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    command: python main.py
    healthcheck:
      # Bot has no HTTP port: healthy = main.py alive + heartbeat fresh (<120s).
      test: ["CMD-SHELL", "python -c \"import os,time,sys; p='data/bot_heartbeat'; sys.exit(0 if (os.path.exists(p) and time.time()-os.path.getmtime(p)<120) else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - mila_network

  # ============================================================
  # Mila Observatory — FastAPI web panel
  # ============================================================

  observatory:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mila-observatory
    user: root
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # The container must bind 0.0.0.0: its own 127.0.0.1 is an isolated
      # loopback, unreachable through a ports mapping. Host exposure is
      # controlled by the `ports` line below.
      OBSERVATORY_HOST: 0.0.0.0
    # Localhost-only by default (OBSERVATORY_HOST defaults to 127.0.0.1).
    # To expose on LAN, set OBSERVATORY_HOST=0.0.0.0 in .env AND set
    # OBSERVATORY_PASSWORD (HTTP Basic Auth).
    ports:
      - "${OBSERVATORY_HOST:-127.0.0.1}:${OBSERVATORY_PORT:-8080}:${OBSERVATORY_PORT:-8080}"
    volumes:
      - .:/app:z
      - mila_data:/app/data
      - mila_logs:/app/logs
      - ./models:/app/models:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    command: python -m Mila_observatory.server
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${OBSERVATORY_PORT:-8080}/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      - bot
    networks:
      - mila_network

volumes:
  mila_data:
  mila_logs:

networks:
  mila_network:
    driver: bridge