services:
  # ============================================================
  # Mila Bot — Telegram userbot
  # ============================================================
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mila-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # Persist data (SQLite, FAISS indexes, photos, logs)
      - mila_data:/app/data
      - mila_logs:/app/logs
      # Mount local AI models (large files, downloaded once)
      - ./models:/app/models:ro
      # Mount Pyrogram session file (created once via create_session.py)
      - ./mila_session.session:/app/mila_session.session:Z
      # Host timezone
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    command: python main.py
    networks:
      - mila_network

  # ============================================================
  # Mila Observatory — FastAPI web panel
  # ============================================================
  observatory:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mila-observatory
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8080:8080"
    volumes:
      # Share the same data directory (SQLite DB)
      - mila_data:/app/data
      - mila_logs:/app/logs
      # Mount local AI models (read-only)
      - ./models:/app/models:ro
      # Host timezone
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    command: python -m Mila_observatory.server
    depends_on:
      - bot
    networks:
      - mila_network

volumes:
  mila_data:
  mila_logs:

networks:
  mila_network:
    driver: bridge