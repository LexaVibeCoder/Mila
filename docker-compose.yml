services:
  # ============================================================
  # Mila Bot — Telegram userbot
  # ============================================================

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mila-bot
    user: root
    restart: unless-stopped
    # Keep stdin open so TDLib auth prompts can be answered via
    # `docker attach mila-bot` (detach with Ctrl-P Ctrl-Q).
    stdin_open: true
    tty: true
    env_file:
      - .env
    volumes:
      - .:/app
      - mila_data:/app/data
      - mila_logs:/app/logs
      # Read-write so `docker compose run --rm bot python install_reranker.py`
      # can download the model into the host's ./models directory.
      - ./models:/app/models
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    command: python main.py
    healthcheck:
      # Bot has no HTTP port: healthy = main.py alive + heartbeat fresh (<120s).
      test: ["CMD-SHELL", "python -c \"import os,time,sys; p='data/bot_heartbeat'; sys.exit(0 if (os.path.exists(p) and time.time()-os.path.getmtime(p)<120) else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - mila_network

  # ============================================================
  # Mila Observatory — FastAPI web panel
  # ============================================================

  observatory:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mila-observatory
    user: root
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # The container must bind 0.0.0.0: its own 127.0.0.1 is an isolated
      # loopback, unreachable through a ports mapping. This is independent
      # from the host interface used by `ports` below.
      OBSERVATORY_HOST: ${OBSERVATORY_BIND_HOST:-0.0.0.0}
    # Host interface and port are taken from .env:
    #   OBSERVATORY_PUBLISH_HOST=127.0.0.1  (local only, default)
    #   OBSERVATORY_PUBLISH_HOST=0.0.0.0    (LAN; set OBSERVATORY_PASSWORD)
    #   OBSERVATORY_PORT=8080               (same inside and outside)
    # OBSERVATORY_HOST is a backward-compatible fallback for existing .env
    # files that used it for LAN exposure before the split.
    ports:
      - "${OBSERVATORY_PUBLISH_HOST:-${OBSERVATORY_HOST:-127.0.0.1}}:${OBSERVATORY_PORT:-8080}:${OBSERVATORY_PORT:-8080}"
    volumes:
      - .:/app:z
      - mila_data:/app/data
      - mila_logs:/app/logs
      - ./models:/app/models
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    command: python -m Mila_observatory.server
    healthcheck:
      # `$$` keeps Compose from interpolating this on the host: the container
      # shell expands its own OBSERVATORY_PORT (from .env) at runtime.
      test: ["CMD-SHELL", "curl -f http://localhost:$${OBSERVATORY_PORT:-8080}/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      - bot
    networks:
      - mila_network

volumes:
  mila_data:
  mila_logs:

networks:
  mila_network:
    driver: bridge
